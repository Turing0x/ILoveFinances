name: ILoveFinances

options:
  bundleIdPrefix: dev.threedots
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.46.0"

settings:
  base:
    # Modo de LENGUAJE Swift 5 con el compilador 6.3. Sin esta linea Xcode 26
    # activa Swift 6 estricto y ModelContext (no Sendable) da errores de
    # aislamiento en cada fichero. Ver PLAN.md seccion 2.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: M2J9PP4RR8
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  ILoveFinances:
    type: application
    platform: iOS
    sources:
      - path: ILoveFinances
        # Sin esto XcodeGen los copiaria ademas como recursos dentro del bundle.
        excludes:
          - "Resources/Info.plist"
          - "Resources/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.threedots.ilovefinances
        PRODUCT_NAME: ILoveFinances
        INFOPLIST_FILE: ILoveFinances/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ILoveFinances/Resources/ILoveFinances.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ILoveFinancesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ILoveFinancesTests
    dependencies:
      - target: ILoveFinances
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.threedots.ilovefinances.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ILoveFinances:
    build:
      targets:
        ILoveFinances: all
    test:
      targets:
        - ILoveFinancesTests
    run:
      config: Debug
